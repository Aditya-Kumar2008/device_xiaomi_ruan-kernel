# Device profile: Redmi Pad Pro 5G (ruan) -- values verified from ruan's own OTA firmware.
# Source: ruan_in_global-ota_full-OS3.0.305.0.WFSINXM (Android 16), vendor_boot DTB "Parrot 4Gb SoC",
#         board-id <0x00 0x600>.  See ../RUAN_VERIFIED_HARDWARE.md
# SoC: Qualcomm SM7435-AB Snapdragon 7s Gen 2 ("parrot"); GPU Adreno 710; Wi-Fi WCN6750;
#      touch Novatek NT36532 (SPI); panel BOE n83 1600x2560.

NAME="Xiaomi Redmi Pad Pro 5G (ruan)"
KIND=phone
SOC="Qualcomm Snapdragon 7s Gen 2 (SM7435)"

# --- boot chain ------------------------------------------------------------------------------------
# No upstream Mu-Silicium port exists for ruan. Adapt garnetPkg (Xiaomi Redmi Note 13 Pro 5G;
# garnet.dsc: SOC_TYPE=0 = SM7435, the same SoC) into a ruanPkg: memory map, driver list, board-id.
# The vendor UEFI drivers must come from ruan's OWN firmware, not garnet's -- they encode this
# board's TLMM/PMIC/USB wiring. Both are in the extracted ROM:
#   /workspace/rom/extracted/uefi.img   (the UEFI firmware volume, _FVH at 0x1000)
#   /workspace/rom/extracted/xbl.img    (32-bit ARM ELF boot loader; NOT a firmware volume)
UEFI_TARGET=ruan
UEFI_FD=
DTB=                            # ruan's tree: extracted to dtbs/vb_05.dtb ("Parrot 4Gb SoC", board-id 0x00 0x600)
FD_BASE=0xA7000000              # CONFIRMED: uefiplat.cfg "UEFI FD" 0xA7000000, size 0x400000
FD_SIZE=0x400000                # CONFIRMED: uefiplat.cfg "UEFI FD" is 0x400000 (garnet: 0x300000)
PAYLOAD_BASE=0xF1400000         # CONFIRMED: free gap between VM PIL (0xE0000000+0x5700000) and DXE Heap (0xF8000000)

# --- kernel and loader -----------------------------------------------------------------------------
# The loader identifies the device by the framebuffer base the UEFI reports.
# TODO: run the UEFI once and read "display W x H at XXXX" -- that XXXX is FB_BASE.
FB_BASE=0x00000000
WIFI_ATH11K=1                   # bt_wcn6750 -> WCN6750, the same radio as redwood

# --- what the run needs ----------------------------------------------------------------------------
# Start with no extras: the system reaches the lock screen with only the framebuffer, touch and CPU.
# Add cpufreq=1, gpu=1, wifi=1, adsp=1 one at a time, after each step works.
BOOTARGS="cpus=8"
DEFAULT_SECS=900
USERLAND_VARS=""
# From ruan's own Android with adb. Note the tablet's layout may differ from the phone's:
# check /vendor/firmware and /vendor/firmware_mnt/image.
FIRMWARE=""
