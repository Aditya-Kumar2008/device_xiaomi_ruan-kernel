#
# ruan -- Redmi Pad Pro 5G (SM7435 "parrot")
# uefi_fd values taken from the device's own uefiplat.cfg: "UEFI FD" 0xA7000000 size 0x400000
# (garnet is 0xA7100000 / 0x300000).
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
[uefi_fd]
base = 0xA7000000
size = 0x400000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = true

#
# Android Boot Image Configs
#
[boot_image]
header_version = 1
